<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg-a:#fff1ec; --bg-b:#ffd0d7; --glow:rgba(255,255,255,.95);
  --ink:#4a1030; --title:#7a1240; --muted:#7a3b57;
  --liquid:#e8336b; --liquid2:#ff86a5; --heart-bg:rgba(232,51,107,.13); --heart-line:#7a1240;
  --btn:#d92a62; --btn-ink:#fff5f7; --gold:#c98413;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-a:#2f0b20; --bg-b:#12030c; --glow:rgba(255,92,138,.26);
    --ink:#ffe9ee; --title:#ffd1de; --muted:#e0a8bb;
    --liquid:#ff5c8a; --liquid2:#ff9fb7; --heart-bg:rgba(255,92,138,.16); --heart-line:#ffd1de;
    --btn:#ff5c8a; --btn-ink:#2b0716; --gold:#f5c26b;
  }
}
:root[data-theme="dark"]{
  --bg-a:#2f0b20; --bg-b:#12030c; --glow:rgba(255,92,138,.26);
  --ink:#ffe9ee; --title:#ffd1de; --muted:#e0a8bb;
  --liquid:#ff5c8a; --liquid2:#ff9fb7; --heart-bg:rgba(255,92,138,.16); --heart-line:#ffd1de;
  --btn:#ff5c8a; --btn-ink:#2b0716; --gold:#f5c26b;
}
*{box-sizing:border-box}
html{background-color:var(--bg-b)}
body{
  margin:0; min-height:100vh; min-height:100dvh; font-family:var(--sans); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(800px 560px at 50% 30%, var(--glow), transparent 70%),
    linear-gradient(180deg, var(--bg-a), var(--bg-b));
  background-color:var(--bg-b);
}
:focus-visible{outline:3px solid var(--gold); outline-offset:4px}
main{width:100%; max-width:460px; padding:28px 22px 40px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center}
h1{margin:0; font-family:var(--display); font-style:italic; font-weight:700; font-size:clamp(2.6rem,11vw,3.8rem); line-height:1.05; color:var(--title)}

.jar{width:min(72vw,280px)}
.jar svg{display:block; width:100%; height:auto; overflow:visible}
.hbg{fill:var(--heart-bg)}
.hline{fill:none; stroke:var(--heart-line); stroke-width:.35; stroke-linejoin:round}
#liquid{transition:transform 2.6s cubic-bezier(.3,.7,.2,1)}
.wave{animation:slosh 3.6s linear infinite}
.wave.w1{fill:var(--liquid2); opacity:.85; animation-duration:5.2s; animation-direction:reverse}
.wave.w2{fill:var(--liquid)}
@keyframes slosh{from{transform:translateX(0)} to{transform:translateX(-12px)}}
.jar.full svg{animation:beat 1.1s ease-in-out 4; transform-origin:50% 50%}
@keyframes beat{0%,100%{transform:scale(1)} 30%{transform:scale(1.06)} 55%{transform:scale(.99)}}

.btn{
  display:inline-flex; align-items:center; justify-content:center; min-width:min(80vw,280px);
  padding:16px 34px; border-radius:999px; text-decoration:none; cursor:pointer;
  font-family:var(--display); font-style:italic; font-weight:700; font-size:2.1rem; line-height:1.1;
  background:var(--btn); color:var(--btn-ink); box-shadow:0 18px 30px -14px var(--btn);
  transition:transform .15s ease;
}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(1px) scale(.98)}
.note{margin:0; color:var(--muted); font-size:1rem; max-width:32ch; text-wrap:balance; min-height:3em}
.note a{color:var(--title); font-weight:700}

@media (prefers-reduced-motion: reduce){
  .wave{animation:none}
  #liquid{transition:none}
  .jar.full svg{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<main>
  <h1>Running low?</h1>

  <div class="jar" id="jar" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <defs>
        <clipPath id="hc"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></clipPath>
      </defs>
      <path class="hbg" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      <g clip-path="url(#hc)">
        <g id="liquid" style="transform:translateY(18.4px)">
          <path class="wave w1" d="M-24 0 q3 -1 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 V30 H-24 Z" transform="translate(0,-0.4)"/>
          <path class="wave w2" d="M-24 0 q3 -1 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 V30 H-24 Z" transform="translate(-3,0.6)"/>
        </g>
      </g>
      <path class="hline" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>

  <a class="btn" id="refill" href="#" target="_blank" rel="noopener">Refill</a>

  <p class="note" id="note" role="status">Tap refill, then press Send in WhatsApp.</p>
</main>

<script>
(function(){
  var PHONE='918903912410';
  var MESSAGE='Refill please \uD83D\uDC97';
  var URL='https://wa.me/'+PHONE+'?text='+encodeURIComponent(MESSAGE);

  var btn=document.getElementById('refill'), note=document.getElementById('note');
  var liquid=document.getElementById('liquid'), jar=document.getElementById('jar');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var resetTimer;
  btn.href=URL;

  function level(l){
    var y=21.6-l*(21.6-2.4);
    liquid.style.transform='translateY('+y+'px)';
  }
  function fill(){
    jar.classList.remove('full');
    level(1);
    setTimeout(function(){jar.classList.add('full')},reduce?0:2400);
  }
  function drain(){
    jar.classList.remove('full');
    level(.16);
    note.textContent='Tap refill, then press Send in WhatsApp.';
  }

  btn.addEventListener('click',function(){
    fill();
    note.innerHTML='Almost there. Press Send in WhatsApp so it reaches him. Didn\u2019t open? <a href="'+URL+'" target="_blank" rel="noopener">Tap here</a>.';
    clearTimeout(resetTimer);
    resetTimer=setTimeout(drain,12000);
  });
})();
</script>
</body>
</html>
